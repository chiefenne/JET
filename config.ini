[run]
; Select which inputs define the solve:
;   physical      -> Reynolds and Prandtl are derived from [scaling]
;   dimensionless -> Reynolds and Prandtl are taken from [dimensionless_case]
mode = dimensionless
discretization = keller_box

[dimensionless_case]
; Used only when [run] mode = dimensionless
Reynolds = 100000.0
Prandtl = 5.0

[scaling]
; Shared physical scaling for dimensional postprocessing.
; In physical mode, these values define the case.
; In dimensionless mode, these values define the SI interpretation.
fluid = water

; Reynolds is based on the half nozzle width:
;   Re = u0 * (nozzle_width / 2) / nu(T0)
;
; recalculate options:
;   none         -> keep nozzle_width and velocity as given
;   velocity     -> compute velocity from Reynolds and nozzle_width
;   nozzle_width -> compute nozzle_width from Reynolds and velocity
recalculate = none

; Current values:
nozzle_width = 0.1
velocity = 20.0

; Dimensionless-mode example 1:
; recalculate = velocity
; nozzle_width = 0.1
; velocity = auto
;
; Dimensionless-mode example 2:
; recalculate = nozzle_width
; nozzle_width = auto
; velocity = 20.0
;
; Physical-mode example:
; recalculate = none
; nozzle_width = 0.1
; velocity = 20.0

nozzle_temperature_C = 25.0
ambient_temperature_C = 20.0

[turbulence]
; Turbulence-model settings, independent of physical/dimensionless mode
Prandtl_turb = 0.9
turbulent = true

[mesh]
; Streamwise and transverse transformed grid
gsimax = 30
dgsi = 0.01
etae = 25.0
deta1 = 0.01
stretch = 1.1

[solver]
; Nonlinear solver settings
solver_type = fsolve
iterations = 100
tolerance = 1e-6

[output]
; Output folders and switches
plot_folder = PLOTS
dimensional_plot_folder = PLOTS_DIMENSIONAL
result_folder = RESULTS
result_filename = results.dat
dimensional_result_filename = results_dimensional.dat
plot_dimensionless = true
plot_dimensional = true
plot_dimensionless_summary = true
plot_dimensional_summary = true
save_dimensional_results = true
verbosity = 1
