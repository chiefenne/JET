[run]
; Choose one strict case definition:
;   physical      -> solve from the physical inputs in
;                    [dimensional (physical)]
;   dimensionless -> solve from the dimensionless inputs in
;                    [dimensionless_case]
mode = dimensionless
discretization = keller_box

[dimensionless_case]
; Strict dimensionless case definition.
; Used only when [run] mode = dimensionless.
Reynolds = 100000.0
Prandtl = 5.0

[dimensional (physical)]
; Strict physical case definition.
; Used when [run] mode = physical.
fluid = water
nozzle_width = 0.1
velocity = 20.0
nozzle_temperature_C = 25.0
ambient_temperature_C = 20.0

[turbulence]
; Used in both physical and dimensionless mode.
Prandtl_turb = 0.9
turbulent = true

[mesh]
; Streamwise and transverse transformed grid
gsimax = 30
dgsi = 0.01
etae = 25.0
deta1 = 0.01
stretch = 1.1

[solver]
; Nonlinear solver settings
solver_type = fsolve
iterations = 100
tolerance = 1e-6

[output]
; Output folders and switches
plot_folder = PLOTS
dimensional_plot_folder = PLOTS_DIMENSIONAL
result_folder = RESULTS
result_filename = results.dat
dimensional_result_filename = results_dimensional.dat
plot_dimensionless = true
plot_dimensional = false
plot_dimensionless_summary = false
plot_dimensional_summary = false
save_dimensional_results = false
verbosity = 1
